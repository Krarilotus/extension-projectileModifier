meta:
  version: 1.0.0
options:
- name: projectile_settings
  display: GroupBox
  header: '{{projectiles}}'
  accordion:
    enabled: true
  children:
  - name: projectile_presets
    display: GroupBox
    header: '{{advanced}}'
    accordion:
      enabled: true
    children:
    - name: projectile_config_file_selector
      display: FileInput
      header: '{{projectile_config_file_selector}}'
      text: '{{projectile_config_file_selector_descr}}'
      url: projectileModifier.projectile_config_file_selector
      contents:
        generalizeExtensionPaths: true
        filter: files
        type: string
        value: ''
  - name: projectile_siege
    display: GroupBox
    header: '{{siege}}'
    accordion:
      enabled: true
    children:
    - name: catapult
      display: GroupBox
      header: '{{unit_catapult}}'
      accordion:
        enabled: true
      children:
      - name: projectileModifier_customizations_catapult_projectile
        display: Choice
        text: '{{projectile}}'
        tooltip: '{{projectile_descr}}'
        url: projectileModifier.customizations.catapult.projectile
        contents:
          type: string
          value: inherit
          choices:
          - name: inherit
            text: '{{inherit}}'
          - name: arrow
            text: '{{p_arrow}}'
          - name: catapult_rock
            text: '{{p_catapult_rock}}'
          - name: trebuchet_rock
            text: '{{p_trebuchet_rock}}'
          - name: mangonel_pebble
            text: '{{p_mangonel_pebble}}'
          - name: crossbow_bolt
            text: '{{p_crossbow_bolt}}'
          - name: ballista_bolt
            text: '{{p_ballista_bolt}}'
          - name: cow
            text: '{{p_cow}}'
          - name: slinger_stone
            text: '{{p_slinger_stone}}'
          - name: firethrower_pot
            text: '{{p_firethrower_pot}}'
          - name: firethrower_pot_untargeted
            text: '{{p_firethrower_pot_untargeted}}'
          - name: fire_ballista_bolt
            text: '{{p_fire_ballista_bolt}}'
      - name: projectileModifier_customizations_catapult_count
        display: UCP2Slider
        header: '{{count}}'
        text: '{{count_descr}}'
        hasHeader: true
        url: projectileModifier.customizations.catapult.count
        contents:
          min: 1
          max: 64
          step: 1
          decimals: 0
          value:
            enabled: false
            sliderValue: 1
      - name: projectileModifier_customizations_catapult_interval
        display: UCP2Slider
        header: '{{interval}}'
        text: '{{interval_descr}}'
        hasHeader: true
        url: projectileModifier.customizations.catapult.interval
        contents:
          min: 1
          max: 60000
          step: 1
          decimals: 0
          value:
            enabled: false
            sliderValue: 100
      - name: projectileModifier_customizations_catapult_range
        display: UCP2Slider
        header: '{{range}}'
        text: '{{range_descr}}'
        hasHeader: true
        url: projectileModifier.customizations.catapult.range
        contents:
          min: 1
          max: 100
          step: 1
          decimals: 0
          value:
            enabled: false
            sliderValue: 20
      - name: projectileModifier_customizations_catapult_targets
        display: Choice
        text: '{{targets}}'
        tooltip: '{{targets_descr}}'
        url: projectileModifier.customizations.catapult.targets
        contents:
          type: string
          value: inherit
          choices:
          - name: inherit
            text: '{{inherit}}'
          - name: units
            text: '{{units}}'
          - name: units_buildings
            text: '{{units_buildings}}'
          - name: fortifications
            text: '{{fortifications}}'
          - name: buildings
            text: '{{buildings}}'
          - name: siege_towers
            text: '{{siege_towers}}'
          - name: cluster
            text: '{{cluster}}'
          - name: walls
            text: '{{walls}}'
      - name: projectileModifier_customizations_catapult_spread_tiles
