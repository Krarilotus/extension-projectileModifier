# yaml-language-server: $schema=./projectile-config.schema.json
# Active example preset. All projectile changes come from this selected file.
# Intervals are simulation ticks, not milliseconds.
units:
  Catapult:
    projectile: mangonel_pebble
    count: 3
    spread: 32 # Native coordinate units: 8 = 1 tile (here, four tiles).
  Siege tower:
    projectile: crossbow_bolt
    count: 2
    interval_moving: 100   # While moving; all intervals are simulation ticks.
    interval_standing: 50 # While stopped. No default interval is needed.
    require_manned: 4
    targets: [units]
    range: 18
    shoot_height: 50
