projectiles: پرتابه‌ها
siege: ماشین‌های محاصره
european: واحدهای اروپایی
arabian: واحدهای عرب
civilian: غیرنظامیان
wildlife: حیوانات و سایر واحدها
inherit: بدون تغییر / استفاده از مقدار فایل
advanced: فایل تنظیمات پیشرفته (اختیاری)
unit_description: ابتدا یک گروه و سپس یک واحد را باز کنید. برای تغییر مقدار عددی، کادر شمشیر را علامت بزنید؛ برای
  دیدن راهنما، تنظیم را باز کنید. تنظیمات غیرفعال، مقدار فایل یا رفتار اصلی را حفظ می‌کنند. برای اعمال تغییرات،
  بازی را دوباره اجرا کنید.
projectile_config_file_selector: فایل تنظیمات پرتابه (YAML)
projectile_config_file_selector_descr: برای تنظیمات پیشرفته مانند حرکت، رگبار مرحله‌ای، دقت، ارتفاع و پویانمایی،
  یک فایل YAML بارگیری کنید. تنظیمات فعالِ زیر جایگزین مقادیر فایل می‌شوند. بدون فایل نیز می‌توانید از تنظیمات معمول
  استفاده کنید. نمونه‌ها و جدول کامل در README.md و شِمای ویرایش در projectile-config.schema.json قرار دارند.
projectile: نوع پرتابه
projectile_descr: پرتابهٔ این واحد را جایگزین می‌کند. اگر فاصلهٔ شلیک خودکار تنظیم نشود، زمان‌بندی حملهٔ اصلی حفظ
  می‌شود.
targets: هدف‌های خودکار
targets_descr: هدف‌های شلیک خودکار. واحدها و ساختمان‌های هم‌پیمان مستثنا هستند. دیوارها شامل دیوارهای خودتان هم
  می‌شوند. فهرست اولویت دلخواه را می‌توان در فایل YAML وارد کرد.
units: واحدهای دشمن
buildings: ساختمان‌های دشمن
fortifications: استحکامات دشمن
siege_towers: برج‌های محاصرهٔ دشمنِ متصل به دیوار
cluster: گروه‌های واحدهای دشمن
walls: همهٔ دیوارها (از جمله دیوارهای خودتان)
units_buildings: ابتدا واحدها، سپس استحکامات و ساختمان‌ها
count: تعداد پرتابه در هر رگبار
count_descr: تعداد پرتابه در هر رگبار اصلی یا خودکار (۱–۶۴). تعداد پرتابهٔ رگبار اصلی منجنیق پراکنده‌زن را جایگزین
  می‌کند.
interval: فاصلهٔ شلیک خودکار (گام بازی)
interval_descr: شلیک خودکار را برای واحدهای نزدیک‌زن و برج‌های محاصره نیز فعال می‌کند. به‌طور پیش‌فرض جایگزین شلیک‌های
  اصلی می‌شود. از پرتابهٔ اصلی استفاده می‌کند و برای واحدهای بدون پرتابه، تیر به کار می‌برد. گام بازی یک مرحلهٔ
  شبیه‌سازی است، نه میلی‌ثانیه.
range: برد خودکار (خانه)
range_descr: شعاع جست‌وجوی هدف‌های خودکار. برد حملهٔ اصلی را تغییر نمی‌دهد.
spread_tiles: پراکندگی پرتابه‌های اضافی (خانه)
spread_tiles_descr: انحراف تصادفی از پرتابهٔ دوم به بعد در یک رگبار هم‌زمان.
require_manned: مهندسان لازم (۰–۴)
require_manned_descr: تعداد مهندسان داخل ماشین محاصره که برای شلیک خودکار لازم است. صفر، بررسی خدمه را غیرفعال می‌کند.
