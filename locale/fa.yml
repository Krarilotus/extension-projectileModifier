config_help: 'فایل vanilla-projectiles.yml را از ZIP ماژول به ucp/resources/custom-projectiles/ کپی کنید، نسخهٔ
  کپی را ویرایش و اینجا انتخاب کنید. تنظیمات حذف‌شده تغییر نمی‌کنند؛ مسیر خالی هیچ تغییری ایجاد نمی‌کند. قواعد مقدار
  الزامی یا پیشنهادی UCP به کل فایل انتخاب‌شده اعمال می‌شوند. پس از تغییرات، بازی را دوباره اجرا کنید. در زمان‌بندی
  بارگذاری مجدد بازی، turn_before_shot: false چرخش به‌سوی هدف‌های دستی را غیرفعال می‌کند.'
