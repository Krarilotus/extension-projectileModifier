inherit: Sin cambios / usar el archivo
advanced: Archivo de configuración avanzada (opcional)
unit_description: Abre un grupo y después una unidad. Marca la espada para modificar un valor numérico; despliega
  el ajuste para ver su ayuda. Los ajustes desactivados conservan los valores del archivo o el comportamiento original.
  Reinicia el juego para aplicar los cambios.
projectile_config_file_selector: Archivo de proyectiles (YAML)
projectile_config_file_selector_descr: 'Carga un preajuste YAML para las opciones avanzadas: movimiento, salvas
  escalonadas, precisión, altura y animación. Los ajustes activados abajo sustituyen sus valores. Sin archivo, utiliza
  los ajustes habituales. README.md contiene ejemplos y la tabla completa; projectile-config.schema.json proporciona
  el esquema de edición.'
projectile: Proyectil
projectile_descr: Sustituye el proyectil de esta unidad. Sin un intervalo automático, se conserva el ritmo de ataque
  original.
targets: Objetivos automáticos
targets_descr: Objetivos del disparo automático. Se excluyen las unidades y los edificios aliados. Los muros incluyen
  los tuyos. El archivo YAML admite listas de prioridades personalizadas.
units: Unidades enemigas
buildings: Edificios enemigos
fortifications: Fortificaciones enemigas
siege_towers: Torres de asedio enemigas acopladas
cluster: Grupos de unidades enemigas
walls: Todos los muros (incluidos los tuyos)
units_buildings: Unidades, después fortificaciones y edificios
count: Proyectiles por salva
count_descr: Número de proyectiles por salva original o automática (1–64). Sustituye el tamaño de la salva original
  del mangonel.
interval: Intervalo de disparo automático (ticks)
interval_descr: Activa el disparo automático, también para unidades cuerpo a cuerpo y torres de asedio. Sustituye
  los disparos originales de forma predeterminada. Usa el proyectil original o flechas si la unidad no tenía ninguno.
  Un tick es un paso de simulación, no un milisegundo.
range: Alcance automático (casillas)
range_descr: Radio de búsqueda de objetivos automáticos. No modifica el alcance del ataque original.
spread_tiles: Dispersión de proyectiles adicionales (casillas)
spread_tiles_descr: Desviación aleatoria a partir del segundo proyectil de una salva simultánea.
require_manned: Ingenieros necesarios (0–4)
require_manned_descr: Número de ingenieros a bordo necesario para disparar automáticamente. Cero desactiva la comprobación
  de la dotación.
