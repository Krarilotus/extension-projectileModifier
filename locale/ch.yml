projectiles: 弹射物
siege: 攻城器械
european: 欧洲单位
arabian: 阿拉伯单位
civilian: 平民
wildlife: 动物及其他单位
inherit: 不更改／使用文件设置
advanced: 高级配置文件（可选）
unit_description: 展开单位分组，再选择单位。勾选剑形复选框以修改数值；展开设置可查看说明。未启用的设置保留文件中的值；未选择文件时则保留原有行为。重新启动游戏后更改才会生效。
projectile_config_file_selector: 弹射物配置文件（YAML）
projectile_config_file_selector_descr: 加载 YAML 预设以调整移动、分批齐射、精度、高度及动画等高级设置。下方已启用的设置会覆盖文件中的值。不加载文件也可使用常用设置。示例及完整表格见
  README.md；编辑器配置模式见 projectile-config.schema.json。
projectile: 弹射物类型
projectile_descr: 替换此单位发射的弹射物。不设置自动射击间隔时，保留原有攻击节奏。
targets: 自动攻击目标
targets_descr: 自动射击的目标。排除友方单位和建筑。城墙目标也包括己方城墙。可在 YAML 文件中设置自定义目标优先级。
units: 敌方单位
buildings: 敌方建筑
fortifications: 敌方防御工事
siege_towers: 已靠墙的敌方攻城塔
cluster: 敌方单位群
walls: 所有城墙（包括己方城墙）
units_buildings: 先攻击单位，再攻击防御工事，最后攻击建筑
count: 每轮齐射的弹射物数量
count_descr: 每轮原有或自动齐射的弹射物数量（1–64）。替换散射投石器原有的齐射数量。
interval: 自动射击间隔（游戏步数）
interval_descr: 启用自动射击，也适用于近战单位和攻城塔。默认替换原有射击。使用原有弹射物；没有弹射物的单位默认使用箭矢。游戏步数表示模拟步长，不是毫秒。
range: 自动射程（格）
range_descr: 自动目标搜索半径。不改变原有攻击射程。
spread_tiles: 额外弹射物散布（格）
spread_tiles_descr: 同一轮同时发射的弹射物从第二发起增加随机偏移。
require_manned: 所需工程师数量（0–4）
require_manned_descr: 自动射击所需的器械内工程师数量。设为零可关闭乘员检查。
balance_changes: Balance Changes
