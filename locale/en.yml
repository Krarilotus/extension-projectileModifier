civilian: Civilians
wildlife: Animals and Other Units
inherit: Unchanged / use file setting
advanced: Advanced configuration file (optional)
unit_description: Open a family, then a unit. Tick the sword checkbox to override a numeric value; expand the setting
  to read its help. Disabled settings preserve file values or the original behavior. Relaunch the game to apply
  changes.
projectile_config_file_selector: Projectile settings file (YAML)
projectile_config_file_selector_descr: Load a YAML preset for advanced movement, staggered volleys, accuracy, height
  and animation settings. Enabled controls below override its values. Without a file, use the common settings. Examples
  and the complete table are in README.md; the editor schema is projectile-config.schema.json.
projectile: Projectile
projectile_descr: Replace the projectile released by this unit. Without an interval, the original attack timing
  remains.
targets: Automatic targets
targets_descr: Targets for the interval attack. Units and buildings exclude allies. Wall targeting includes your
  own walls. Custom priority lists can be entered in the YAML file.
units: Enemy units
buildings: Enemy buildings
fortifications: Enemy fortifications
siege_towers: Attached enemy siege towers
cluster: Groups of enemy units
walls: Any walls (including your own)
units_buildings: Units, then fortifications, then buildings
count: Projectiles per volley
count_descr: Number of projectiles per native or automatic volley (1–64). Replaces the native mangonel volley size.
interval: Automatic firing interval (ticks)
interval_descr: Enables automatic fire, including for melee units and siege towers. Replaces native shots unless
  suppression is explicitly disabled. Uses the original projectile, or arrows for units without one. A tick is a
  simulation step, not a millisecond.
range: Automatic range (tiles)
range_descr: Search radius for automatic targets. Does not change the native attack range.
spread_tiles: Extra projectile spread (tiles)
spread_tiles_descr: Random offset for projectiles after the first in a simultaneous volley.
require_manned: Required engineers (0–4)
require_manned_descr: Automatic fire requires this many engineers aboard the siege engine. Zero disables the crew
  check.
