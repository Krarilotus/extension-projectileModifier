balance_changes: Balance Changes
config_file: Projectile configuration file (YAML)
config_help: 'Copy vanilla-projectiles.yml from the module ZIP into ucp/resources/custom-projectiles/, edit the
  copy and select it here. Omitted settings stay unchanged; an empty path makes no changes. UCP required/suggested
  rules apply to the selected file as a whole. Restart the game after changes. With native reload timing, turn_before_shot:
  false disables turning toward manual targets.'
