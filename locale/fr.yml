projectiles: Projectiles
siege: Engins de siège
european: Unités européennes
arabian: Unités arabes
civilian: Civils
wildlife: Animaux et autres unités
inherit: Inchangé / utiliser le fichier
advanced: Fichier de configuration avancée (facultatif)
unit_description: Ouvrez une famille, puis une unité. Cochez l’épée pour modifier une valeur numérique ; dépliez
  le réglage pour afficher son aide. Les réglages désactivés conservent les valeurs du fichier ou le comportement
  d’origine. Relancez le jeu pour appliquer les changements.
projectile_config_file_selector: Fichier de projectiles (YAML)
projectile_config_file_selector_descr: 'Chargez un préréglage YAML pour les options avancées : mouvement, salves
  échelonnées, précision, hauteur et animation. Les réglages activés ci-dessous remplacent ses valeurs. Sans fichier,
  utilisez les réglages courants. Exemples et tableau complet dans README.md ; schéma d’édition dans projectile-config.schema.json.'
projectile: Projectile
projectile_descr: Remplace le projectile de cette unité. Sans intervalle automatique, le rythme d’attaque d’origine
  est conservé.
targets: Cibles automatiques
targets_descr: Cibles du tir automatique. Les unités et bâtiments alliés sont exclus. Les murs incluent les vôtres.
  Le fichier YAML permet de définir une liste de priorités personnalisée.
units: Unités ennemies
buildings: Bâtiments ennemis
fortifications: Fortifications ennemies
siege_towers: Tours de siège ennemies accostées
cluster: Groupes d’unités ennemies
walls: Tous les murs (y compris les vôtres)
units_buildings: Unités, puis fortifications, puis bâtiments
count: Projectiles par salve
count_descr: Nombre de projectiles par salve d’origine ou automatique (1–64). Remplace la taille de salve d’origine
  du mangonneau.
interval: Intervalle de tir automatique (ticks)
interval_descr: Active le tir automatique, même pour les unités de mêlée et les tours de siège. Remplace les tirs
  d’origine par défaut. Utilise le projectile d’origine ou des flèches si l’unité n’en possède pas. Un tick est
  un pas de simulation, pas une milliseconde.
range: Portée automatique (cases)
range_descr: Rayon de recherche des cibles automatiques. Ne modifie pas la portée de l’attaque d’origine.
spread_tiles: Dispersion des projectiles supplémentaires (cases)
spread_tiles_descr: Écart aléatoire à partir du deuxième projectile d’une salve simultanée.
require_manned: Ingénieurs requis (0–4)
require_manned_descr: Nombre d’ingénieurs à bord requis pour le tir automatique. Zéro désactive la vérification
  de l’équipage.
