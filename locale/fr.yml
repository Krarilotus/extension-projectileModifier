balance_changes: Balance Changes
config_file: Fichier de configuration des projectiles (YAML)
config_help: Copiez vanilla-projectiles.yml depuis le ZIP du module dans ucp/resources/projectileModifier/, modifiez
  la copie et sélectionnez-la ici. Les réglages omis restent inchangés ; un chemin vide ne modifie rien. Les règles
  UCP de valeurs requises ou suggérées portent sur le fichier choisi dans son ensemble. Relancez le jeu après les
  modifications.
