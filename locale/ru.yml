balance_changes: Balance Changes
config_file: Файл настроек снарядов (YAML)
config_help: 'Скопируйте полный файл vanilla-projectiles.yml из ZIP, измените и выберите копию. native сохраняет
  правила игры; пустой путь ничего не меняет. auto_targeting: false разрешает только ручные приказы атаки. strict_range:
  false возвращает округлённую проверку дальности; turn_before_shot: false отключает исправление поворота. Обязательное/рекомендуемое
  применяется к выбору файла целиком. После изменений перезапустите игру.'
