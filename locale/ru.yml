wildlife: Животные и прочие юниты
inherit: Без изменений / значение из файла
advanced: Файл расширенных настроек (необязательно)
unit_description: Раскройте группу, затем юнита. Отметьте меч, чтобы изменить числовое значение; раскройте настройку,
  чтобы прочитать подсказку. Отключённые настройки сохраняют значения из файла или исходное поведение. Для применения
  изменений перезапустите игру.
projectile_config_file_selector: Файл настроек снарядов (YAML)
projectile_config_file_selector_descr: 'Загрузите файл YAML для расширенных настроек: движения, последовательных
  залпов, точности, высоты и анимации. Включённые ниже настройки заменяют значения из файла. Без файла доступны
  основные настройки. Примеры и полная таблица приведены в README.md; схема для редактора — projectile-config.schema.json.'
projectile: Снаряд
projectile_descr: Заменяет снаряд этого юнита. Без автоматического интервала сохраняется исходный темп атаки.
targets: Автоматические цели
targets_descr: Цели автоматической стрельбы. Союзные юниты и здания исключены. Стены включают и ваши собственные.
  Свой порядок приоритетов можно задать в файле YAML.
units: Вражеские юниты
buildings: Вражеские здания
fortifications: Вражеские укрепления
siege_towers: Пристыкованные вражеские осадные башни
cluster: Группы вражеских юнитов
walls: Любые стены (включая собственные)
units_buildings: Юниты, затем укрепления, затем здания
count: Снарядов в залпе
count_descr: Число снарядов в исходном или автоматическом залпе (1–64). Заменяет исходное число снарядов мангонели.
interval: Интервал автоматической стрельбы (тики)
interval_descr: Включает автоматическую стрельбу, в том числе для бойцов ближнего боя и осадных башен. По умолчанию
  заменяет исходные выстрелы. Используется исходный снаряд, а при его отсутствии — стрелы. Тик — шаг симуляции,
  а не миллисекунда.
range: Автоматическая дальность (клетки)
range_descr: Радиус поиска автоматических целей. Не меняет исходную дальность атаки.
spread_tiles: Разброс дополнительных снарядов (клетки)
spread_tiles_descr: Случайное отклонение начиная со второго снаряда одновременного залпа.
require_manned: Требуется инженеров (0–4)
require_manned_descr: Число инженеров внутри осадной машины, необходимое для автоматической стрельбы. Ноль отключает
  проверку экипажа.
