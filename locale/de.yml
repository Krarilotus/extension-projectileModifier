balance_changes: Balance Changes
projectiles: Geschosse
siege: Belagerungsgeräte
european: Europäische Einheiten
arabian: Arabische Einheiten
civilian: Zivilisten
wildlife: Tiere und sonstige Einheiten
inherit: Unverändert / Dateieinstellung verwenden
advanced: Erweiterte Konfigurationsdatei (optional)
unit_description: Eine Gruppe und dann eine Einheit aufklappen. Das Schwert-Kontrollkästchen aktiviert eine Zahlenänderung;
  die aufgeklappte Einstellung zeigt ihre Hilfe. Deaktivierte Einstellungen behalten Dateiwert oder ursprüngliches
  Verhalten bei. Das Spiel neu starten, um Änderungen anzuwenden.
projectile_config_file_selector: Geschosseinstellungsdatei (YAML)
projectile_config_file_selector_descr: Eine YAML-Vorlage für erweiterte Einstellungen zu Bewegung, verzögerten Salven,
  Genauigkeit, Höhe und Animation laden. Aktivierte Regler unten überschreiben ihre Werte. Ohne Datei sind die üblichen
  Einstellungen verfügbar. Beispiele und vollständige Tabelle stehen in README.md; das Editorschema heißt projectile-config.schema.json.
projectile: Geschoss
projectile_descr: Ersetzt das Geschoss dieser Einheit. Ohne Intervall bleibt der ursprüngliche Angriffszeitpunkt
  erhalten.
targets: Automatische Ziele
targets_descr: Ziele für den Intervallangriff. Einheiten und Gebäude schließen Verbündete aus. Mauern schließen
  eigene Mauern ein. Eigene Prioritätslisten sind in der YAML-Datei möglich.
units: Feindliche Einheiten
buildings: Feindliche Gebäude
fortifications: Feindliche Befestigungen
siege_towers: Angedockte feindliche Belagerungstürme
cluster: Gruppen feindlicher Einheiten
walls: Alle Mauern (auch eigene)
units_buildings: Einheiten, dann Befestigungen, dann Gebäude
count: Geschosse pro Salve
count_descr: Anzahl pro ursprünglicher oder automatischer Salve (1–64). Ersetzt die ursprüngliche Salvenstärke der
  Mangonel.
interval: Automatisches Schussintervall (Ticks)
interval_descr: Aktiviert automatisches Feuer, auch für Nahkämpfer und Belagerungstürme. Ersetzt ursprüngliche Schüsse,
  sofern die Unterdrückung nicht ausdrücklich ausgeschaltet wird. Nutzt das ursprüngliche Geschoss oder sonst Pfeile.
  Ein Tick ist ein Simulationsschritt, keine Millisekunde.
range: Automatische Reichweite (Felder)
range_descr: Suchradius für automatische Ziele. Ändert nicht die ursprüngliche Angriffsreichweite.
spread_tiles: Streuung zusätzlicher Geschosse (Felder)
spread_tiles_descr: Zufällige Abweichung ab dem zweiten Geschoss einer gleichzeitigen Salve.
require_manned: Benötigte Ingenieure (0–4)
require_manned_descr: Automatisches Feuer benötigt diese Anzahl an Ingenieuren im Gerät. Null deaktiviert die Besatzungsprüfung.
