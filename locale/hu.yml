advanced: Haladó beállítások fájlja (opcionális)
unit_description: Nyiss meg egy csoportot, majd egy egységet. A kard jelölőnégyzetével engedélyezheted a számérték
  módosítását; a beállítást lenyitva olvashatod a súgót. A kikapcsolt beállítások megtartják a fájl értékeit vagy
  az eredeti működést. A változtatások alkalmazásához indítsd újra a játékot.
projectile_config_file_selector: Lövedékbeállítások fájlja (YAML)
projectile_config_file_selector_descr: 'Tölts be YAML-fájlt a haladó beállításokhoz: mozgás, késleltetett sortűz,
  pontosság, magasság és animáció. Az alább bekapcsolt beállítások felülírják a fájl értékeit. Fájl nélkül az alapbeállítások
  használhatók. Példák és teljes táblázat a README.md fájlban; szerkesztési séma a projectile-config.schema.json
  fájlban.'
projectile: Lövedék
projectile_descr: Lecseréli az egység lövedékét. Automatikus időköz nélkül megmarad az eredeti támadási ütem.
targets: Automatikus célpontok
targets_descr: Az automatikus tüzelés célpontjai. A szövetséges egységek és épületek kimaradnak. A falak közé a
  saját falak is beletartoznak. Egyéni fontossági sorrend a YAML-fájlban adható meg.
units: Ellenséges egységek
buildings: Ellenséges épületek
fortifications: Ellenséges erődítmények
siege_towers: Falhoz csatlakozott ellenséges ostromtornyok
cluster: Ellenséges egységcsoportok
walls: Minden fal (a sajátokat is beleértve)
units_buildings: Egységek, majd erődítmények, majd épületek
count: Lövedékek száma sortüzenként
count_descr: Az eredeti vagy automatikus sortűz lövedékeinek száma (1–64). Felülírja a mangonel eredeti sortüzének
  méretét.
interval: Automatikus tüzelési időköz (játékütem)
interval_descr: Engedélyezi az automatikus tüzelést a közelharci egységeknek és az ostromtornyoknak is. Alapértelmezés
  szerint lecseréli az eredeti lövéseket. Az eredeti lövedéket használja, ennek hiányában nyilakat. A játékütem
  szimulációs lépés, nem ezredmásodperc.
range: Automatikus hatótáv (mező)
range_descr: Az automatikus célpontkeresés sugara. Nem módosítja az eredeti támadási hatótávot.
spread_tiles: További lövedékek szórása (mező)
spread_tiles_descr: Véletlen eltérés az egyidejű sortűz második lövedékétől kezdve.
require_manned: Szükséges mérnökök (0–4)
require_manned_descr: Az automatikus tüzeléshez ennyi mérnöknek kell az ostromgépben lennie. A nulla kikapcsolja
  a legénység ellenőrzését.
