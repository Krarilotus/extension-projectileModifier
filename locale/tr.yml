inherit: Değiştirme / dosyadaki değeri kullan
advanced: Gelişmiş yapılandırma dosyası (isteğe bağlı)
unit_description: Bir grubu, ardından bir birimi açın. Sayısal bir değeri değiştirmek için kılıç kutusunu işaretleyin;
  yardımı görmek için ayarı genişletin. Devre dışı ayarlar dosyadaki değerleri veya özgün davranışı korur. Değişiklikleri
  uygulamak için oyunu yeniden başlatın.
projectile_config_file_selector: Mermi yapılandırma dosyası (YAML)
projectile_config_file_selector_descr: Hareket, gecikmeli salvolar, isabet, yükseklik ve animasyon gibi gelişmiş
  ayarlar için YAML dosyası yükleyin. Aşağıda etkinleştirilen ayarlar dosyadaki değerleri geçersiz kılar. Dosya
  olmadan temel ayarları kullanabilirsiniz. Örnekler ve tam tablo README.md dosyasında; düzenleme şeması projectile-config.schema.json
  dosyasındadır.
projectile: Mermi
projectile_descr: Bu birimin attığı mermiyi değiştirir. Otomatik atış aralığı yoksa özgün saldırı zamanlaması korunur.
targets: Otomatik hedefler
targets_descr: Otomatik atış hedefleri. Müttefik birimler ve binalar hariç tutulur. Surlar kendi surlarınızı da
  kapsar. YAML dosyasında özel öncelik listeleri tanımlanabilir.
units: Düşman birimleri
buildings: Düşman binaları
fortifications: Düşman tahkimatları
siege_towers: Sura yanaşmış düşman kuşatma kuleleri
cluster: Düşman birimi grupları
walls: Tüm surlar (sizinkiler dahil)
units_buildings: Önce birimler, sonra tahkimatlar ve binalar
count: Salvo başına mermi
count_descr: Özgün veya otomatik salvo başına mermi sayısı (1–64). Mangonelin özgün salvo boyutunu değiştirir.
interval: Otomatik atış aralığı (oyun adımı)
interval_descr: Yakın dövüş birimleri ve kuşatma kuleleri dahil otomatik atışı etkinleştirir. Varsayılan olarak
  özgün atışların yerini alır. Özgün mermiyi, mermisi olmayan birimlerde ise okları kullanır. Oyun adımı milisaniye
  değil, bir simülasyon adımıdır.
range: Otomatik menzil (kare)
range_descr: Otomatik hedef arama yarıçapı. Özgün saldırı menzilini değiştirmez.
spread_tiles: Ek mermilerin dağılımı (kare)
spread_tiles_descr: Aynı anda atılan salvoda ikinci mermiden itibaren uygulanan rastgele sapma.
require_manned: Gerekli mühendis sayısı (0–4)
require_manned_descr: Otomatik atış için kuşatma makinesinde bulunması gereken mühendis sayısı. Sıfır, mürettebat
  kontrolünü kapatır.
